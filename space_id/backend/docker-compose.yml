services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: space_id
      POSTGRES_USER: space_id
      POSTGRES_PASSWORD: space_id_dev
    ports:
      - "54329:5432"
    volumes:
      - space_id_postgres:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro

volumes:
  space_id_postgres:
